<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#5B4DFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B12" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="معاينة ويب لتطبيق أصول المصممين — مكتبة صور وستيكرات وملحقات" />
  <title>أصول المصممين</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Library -->
    <section id="screen-library" class="screen active" aria-label="المكتبة">
      <div class="scroll-area" id="library-scroll">
        <header class="sticky-header">
          <div class="nav-large">
            <h1>المكتبة</h1>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="تبديل المظهر"></button>
          </div>
          <div class="search-wrap">
            <div class="search-bar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
              </svg>
              <input id="search-input" type="search" enterkeyhint="search" autocomplete="off"
                placeholder="ابحث عن صور، ستيكرات، ملحقات…" aria-label="بحث" />
              <button type="button" class="search-clear" id="search-clear" aria-label="مسح البحث">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.6L7.4 6 6 7.4l4.6 4.6L6 16.6 7.4 18l4.6-4.6 4.6 4.6 1.4-1.4-4.6-4.6L18 7.4 16.6 6 12 10.6z"/></svg>
              </button>
              <button type="button" class="filter-btn" aria-label="فلاتر" id="filter-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 6h16M7 12h10M10 18h4"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="chips" id="chips" role="tablist" aria-label="تصفية النوع"></div>
        </header>

        <div class="grid" id="library-grid"></div>
        <div id="library-empty" class="state-block" hidden>
          <div class="icon-lg">🔍</div>
          <h3>لا نتائج</h3>
          <p class="t-footnote">جرّب كلمات أخرى أو غيّر التصنيف</p>
        </div>
        <p id="library-end" class="end-caption" hidden>وصلت إلى نهاية القائمة</p>
      </div>
    </section>

    <!-- Saved -->
    <section id="screen-saved" class="screen" aria-label="المحفوظات">
      <div class="scroll-area">
        <header class="sticky-header">
          <div class="nav-large">
            <h1>المحفوظات</h1>
          </div>
        </header>
        <div class="grid" id="saved-grid"></div>
        <div id="saved-empty" class="state-block" hidden>
          <div class="icon-lg">🔖</div>
          <h3>لا توجد عناصر محفوظة</h3>
          <p class="t-footnote">احفظ أصولاً من المكتبة لتظهر هنا</p>
        </div>
      </div>
    </section>

    <!-- Detail -->
    <section id="screen-detail" class="screen" aria-label="تفاصيل الأصل">
      <header class="detail-nav">
        <button type="button" class="back-btn" id="back-btn" aria-label="رجوع">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <h2 id="detail-title"></h2>
      </header>
      <div class="scroll-area" id="detail-scroll">
        <div class="detail-body">
          <div class="detail-preview" id="detail-preview"></div>
          <div class="detail-meta-chips" id="detail-chips"></div>
          <p class="detail-stats" id="detail-stats"></p>
          <div class="section-label">الوسوم</div>
          <div class="tags" id="detail-tags"></div>
          <div id="similar-section">
            <div class="section-label">مشابه</div>
            <div class="similar-row" id="detail-similar"></div>
          </div>
        </div>
      </div>
      <footer class="sticky-footer">
        <button type="button" class="btn-primary" id="detail-download">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
          تنزيل
        </button>
        <button type="button" class="btn-secondary" id="detail-save" aria-label="حفظ"></button>
      </footer>
    </section>

    <nav class="tab-bar" aria-label="التنقل الرئيسي">
      <button type="button" data-tab="library" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        المكتبة
      </button>
      <button type="button" data-tab="saved">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15.2l-6.5-3.6-6.5 3.6V5A1.5 1.5 0 0 1 7 3.5z"/></svg>
        المحفوظات
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
