name: DesignerAssets
options:
  bundleIdPrefix: com.designerassets
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: "أصول المصمم"
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_LANGUAGE: ar
configs:
  Debug: debug
  Release: release
targets:
  DesignerAssets:
    type: application
    platform: iOS
    sources:
      - path: DesignerAssets
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designerassets.app
        PRODUCT_NAME: DesignerAssets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: DesignerAssets/App/Info.plist
      properties:
        CFBundleDisplayName: أصول المصمم
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations:
          - ar
          - en
        UIApplicationSupportsIndirectInputEvents: true
schemes:
  DesignerAssets:
    build:
      targets:
        DesignerAssets: all
    run:
      config: Debug
    archive:
      config: Release
